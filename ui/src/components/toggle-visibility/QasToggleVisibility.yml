type: component

meta:
  desc: Componente para ocultar e exibir conteúdo, utilizado para dados sensíveis.

props:
  group:
    desc: Propriedade para criar grupos de separação.
    default: ''
    type: String
    examples: ["name", "document", "users"]

  scope:
    desc: Separa o contador de limite de visualizações por contexto. Componentes que compartilham o mesmo scope somam suas visualizações no mesmo limite (10 a cada 1 minuto).
    default: 'default'
    type: String
    examples: ["email", "phone", "document"]

  text:
    desc: Texto a ser oculto/exibido.
    default: ''
    type: String

  uuid:
    desc: É criado um uuid random para cada componente, para que possa ser feito o controle interno, porém é possível sobrescrever por esta propriedade.
    default: ''
    type: String

  width:
    desc: Tamanho do conteúdo a ser oculto/exibido.
    default: '140px'
    type: String

  visible-tooltip:
    desc: Texto do tooltip exibido quando o conteúdo está visível.
    default: 'Ocultar conteúdo'
    type: String

  hidden-tooltip:
    desc: Texto do tooltip exibido quando o conteúdo está oculto.
    default: 'Exibir conteúdo'
    type: String

slots:
  default:
    desc: Slot para inserir conteúdo a ser oculto/exibido.
