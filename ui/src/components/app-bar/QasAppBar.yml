type: component

meta:
  desc: Gerencia a barra superior da aplicação

props:
  app-user-props:
    desc: Props repassadas para o QasAppUser.
    default: {}
    type: Object
    required: true

  brand:
    desc: Path do logotipo.
    type: String

  notifications:
    desc: Lista com as notificações do usuário.
    type: Object
    default: {}

  title:
    desc: Título da aplicação.
    required: true
    type: String

  use-dark-mode:
    desc: Controla a exibição do toggle de dark mode no AppBar. Quando `true`, exibe o toggle. Quando `false`, oculta o toggle. Quando `undefined` (default), segue a configuração global de `asteroid.config.js → framework.featureToggle.useDarkMode`.
    default: undefined
    type: Boolean

slots:
  user:
    desc: Slot para acessar o menu de usuário.
    scope:
      user:
        desc: Informações do usuário, recebe o objeto "user".
        type: Object
        default: {}

events:
  '@sign-out -> function()':
    desc: Dispara quando o botão de "sair" é clicado.

  '@toggle-menu -> function()':
    desc: Dispara quando o botão de "hambúrguer" é clicado para abrir o menu lateral.

  '@toggle-notifications -> function()':
    desc: Dispara quando o botão de "Notificações" é clicado.
